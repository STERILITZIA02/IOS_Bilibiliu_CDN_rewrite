name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify release inputs
        run: npm run check

      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --notes "Automated checks passed. Real-device iOS 26/27 acceptance remains explicitly device-dependent; follow docs/DEVICE_ACCEPTANCE.md and report the tested matrix."
          --verify-tag
          --fail-on-no-commits
          dist/Bilibili.CDN.sgmodule
          dist/Bilibili.CDN.Enhanced.sgmodule
          dist/Bilibili.CDN.Switcher.sgmodule
          dist/Bilibili.list
          dist/bilibili-cdn.js
          dist/bilibili-enhance.js
          dist/module-options.json
          dist/SHA256SUMS.txt

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        run: npm --prefix site ci --ignore-scripts --no-audit --no-fund

      - name: Verify release inputs
        run: npm run check:all

      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --notes "Automated checks passed. Real-device iOS 26/27 acceptance remains explicitly device-dependent; follow docs/DEVICE_ACCEPTANCE.md and report the tested matrix."
          --verify-tag
          --fail-on-no-commits
          dist/Bilibili.CDN.sgmodule
          dist/Bilibili.CDN.Enhanced.sgmodule
          dist/Bilibili.CDN.Switcher.sgmodule
          dist/Bilibili.list
          dist/bilibili-cdn.js
          dist/bilibili-cdn-route.js
          dist/bilibili-cdn-benchmark.js
          dist/bilibili-enhance.js
          dist/bilibili-refresh.js
          dist/bilibili-story.js
          dist/bilibili-story-cdn.js
          dist/module-options.json
          dist/modules.list
          dist/SHA256SUMS.txt
